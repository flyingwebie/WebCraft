name: Images

# Builds the web and worker images for amd64 and arm64 and publishes them to the GitHub Container
# Registry: ghcr.io/<owner>/webcraft-web and ghcr.io/<owner>/webcraft-worker. A push to main publishes
# `main` and `sha-<commit>`; a release tag `v1.2.3` publishes `1.2.3`, `1.2`, `1` and `latest`.
# Each platform is built on a runner of its own architecture (Bun can't run the admin's build under
# QEMU emulation), pushed by digest, then the digests are joined into one multi-platform tag per image.
#
# Every action is named by its commit (the version beside it is for people): a tag can be moved to
# other code, a commit can't, and these jobs hold the right to publish the images every Install pulls.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Publishing to the registry is each job's own right (below), never the whole workflow's.
permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # Pushes each platform's image by digest.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [web, worker]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: web
            dockerfile: apps/server/Dockerfile
          - image: worker
            dockerfile: apps/worker/Dockerfile
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name the image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/webcraft-${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=WebCraft ${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=WebCraft
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    # Joins the digests under the image's tags.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [web, worker]
    steps:
      - name: Name the image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/webcraft-${IMAGE_NAME}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the platforms under the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ matrix.image }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.title=WebCraft ${IMAGE_NAME}" \
            --annotation "index:org.opencontainers.image.description=WebCraft's ${IMAGE_NAME} process. See docs/deploy in the repository." \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Show the published image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
