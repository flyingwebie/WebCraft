name: Images

# Builds the web and worker images for amd64 and arm64 and publishes them to the GitHub Container
# Registry: ghcr.io/<owner>/webcraft-web and ghcr.io/<owner>/webcraft-worker. A push to main publishes
# `main` and `sha-<commit>`; a release tag `v1.2.3` publishes `1.2.3`, `1.2`, `1` and `latest`.
# Each platform is built on a runner of its own architecture, pushed by digest, then the digests are
# joined into one multi-platform tag per image.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        image: [web, worker]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: web
            dockerfile: apps/server/Dockerfile
          - image: worker
            dockerfile: apps/worker/Dockerfile
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Name the image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/webcraft-${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=WebCraft ${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=WebCraft
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [web, worker]
    steps:
      - name: Name the image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/webcraft-${IMAGE_NAME}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the platforms under the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ matrix.image }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.title=WebCraft ${IMAGE_NAME}" \
            --annotation "index:org.opencontainers.image.description=WebCraft's ${IMAGE_NAME} process. See docs/deploy in the repository." \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Show the published image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
